# Checks the locales, runs the Android unit tests and lint, builds the release APK and AAB, runs the core and desktop
# tests and builds the desktop archives (scripts/desktop-dist.sh). Runs on every push to main and desktop-rework-ui, on pull
# requests, and by hand (`gh workflow run Build`, for a test APK made from the phone). On the PC,
# scripts/release-build.sh does the same, much faster (docs/CONTRIBUTING.md). The APK is signed
# when the repository has the RELEASE_KEYSTORE_B64 and RELEASE_KEY_PROPERTIES secrets, so it installs over the
# release app. The run's Artifacts hold every release file.
name: Build

on:
  push:
    branches: [main, desktop-rework-ui]
  pull_request:
  workflow_dispatch:
    inputs:
      appimage_only:
        description: Build the Linux AppImage only (`gh workflow run Build -f appimage_only=true`)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ !inputs.appimage_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          PROPS: ${{ secrets.RELEASE_KEY_PROPERTIES }}
        if: env.KEYSTORE != ''
        run: |
          mkdir -p local/keys
          echo "$KEYSTORE" | base64 -d > local/keys/quickbuds-release.jks
          printf '%s\n' "$PROPS" > local/keys/keystore.properties
      - name: Every string in all locales
        run: python3 scripts/check-locales.py
      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug
      - run: ./gradlew assembleRelease bundleRelease
      - name: Release names
        run: |
          ver=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk "out/QuickBuds$ver.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/QuickBuds$ver.aab"
      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: out/*
          retention-days: 14

  desktop:
    runs-on: ubuntu-24.04
    # Ubuntu 22.04 (glibc 2.35), so the Linux binary runs on older distros too.
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Packages
        run: |
          apt-get update -qq
          apt-get install -y -qq curl git zip python3 build-essential pkg-config gcc-mingw-w64-x86-64 \
            libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 dpkg-dev file
      - uses: actions/checkout@v5
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --target x86_64-pc-windows-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop -> target
            core -> target
      - name: Test
        if: ${{ !inputs.appimage_only }}
        run: |
          cd core && cargo test
          cd ../desktop && cargo test
      - name: Archives
        env:
          QB_APPIMAGE_ONLY: ${{ inputs.appimage_only && '1' || '' }}
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/Cargo.toml | head -1)
          QB_NATIVE=1 scripts/desktop-dist.sh "$ver"
      - uses: actions/upload-artifact@v6
        with:
          name: desktop
          path: desktop/dist/*
          retention-days: 14
